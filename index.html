<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARDROBE — Minimalist Fashion</title>
  <meta name="description" content="Enduring garments, pure natural materials, and quiet architectural silhouettes.">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Adobe Experience Platform Launch -->
  <script src="https://assets.adobedtm.com/6268dc4b6b26/a453705a8907/launch-39f5c9d23182-development.min.js" async></script>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="WARDROBE Home">WARDROBE</a>
      <nav class="site-nav">
        <a href="index.html" class="nav-link active">Shop</a>
        <a href="cart.html" class="cart-link-btn" aria-label="View Shopping Bag">
          <span>Bag</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Storefront -->
  <main class="container">
    <section class="page-intro">
      <h1>The Permanent Collection</h1>
      <p>Clean architectural lines, noble natural fibers, and timeless restraint.</p>
    </section>

    <!-- Category Filter Tabs -->
    <div class="category-tabs-wrap">
      <div class="category-tabs" id="categoryTabs" role="tablist">
        <button type="button" class="category-pill active" data-category="all">All</button>
        <button type="button" class="category-pill" data-category="outerwear">Outerwear</button>
        <button type="button" class="category-pill" data-category="tailoring">Tailoring</button>
        <button type="button" class="category-pill" data-category="knitwear">Knitwear</button>
        <button type="button" class="category-pill" data-category="dresses">Dresses</button>
        <button type="button" class="category-pill" data-category="accessories">Accessories</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="productsGrid" aria-live="polite"></div>
  </main>

  <!-- Minimal Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; 2026 WARDROBE. All rights reserved.</span>
      <span>Complimentary Worldwide Express Shipping</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
